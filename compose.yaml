name: cadastro-parte2
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cadastro_parte2
      MYSQL_USER: cadastro
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_parte2:/var/lib/mysql
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u cadastro cadastro_parte2 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    build: .
    environment:
      TZ: America/Sao_Paulo
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/cadastro/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_parte2:
    name: cadastro-parte2-mysql
